name: Verify Labs, Cross-Walk & Web Deck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Go vet & race-enabled test suite
        run: |
          cd code
          go vet ./...
          go test -race -count=1 -v ./...

      - name: Run Go & Python offline verification suite
        run: bash code/scripts/offline_verify.sh

      - name: Run standalone lab assertions
        run: |
          python3 labs/gate_demo.py --test
          python3 labs/approval.py --test
          python3 labs/audit.py --test

      - name: Validate machine-readable cross-walk (JSON & CSV)
        run: make validate-crosswalk

      - name: Verify board policy YAML parity (code/config vs examples)
        run: diff -u code/config/policy.yaml examples/policy.yaml

      - name: Validate Mermaid diagrams (single-line JSON init & sequence syntax)
        run: |
          python3 -c '
          import glob, json, re
          files = ["README.md"] + glob.glob("docs/**/*.md", recursive=True)
          total = 0
          for f in files:
              txt = open(f).read()
              for mb in re.findall(r"```mermaid\n(.*?)```", txt, re.S):
                  total += 1
                  m = re.match(r"%%\{init:\s*(\{[^\n]+\})\s*\}%%", mb)
                  assert m, f"Expected single-line init JSON in {f}"
                  json.loads(m.group(1))
                  if "sequenceDiagram" in mb:
                      for line in mb.splitlines():
                          if not line.strip().startswith("%%"):
                              assert ";" not in line, f"Semicolon breaks sequenceDiagram in {f}: {line}"
          print(f"[OK] {total} Mermaid diagrams validated across Markdown docs.")
          '

      - name: Validate index.html JS syntax & asset references
        run: |
          node -e '
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const m = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!m) throw new Error("No script block found");
          new Function(m[1]);
          const refs = [...html.matchAll(/src="(assets\/[^"]+)"/g)].map(x => x[1]);
          for (const r of refs) {
            if (!fs.existsSync(r)) throw new Error("Missing asset: " + r);
          }
          console.log(`[OK] index.html JS syntax valid; ${refs.length} asset refs verified.`);
          '
