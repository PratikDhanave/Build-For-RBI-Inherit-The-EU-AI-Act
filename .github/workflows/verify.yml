name: Verify Go Modules, Labs, WASM & Web Deck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Go vet & race-enabled test suite (code & labs)
        run: |
          (cd code && go vet ./... && go test -race -count=1 -v ./...)
          (cd labs && go vet ./... && go test -race -count=1 -v ./...)

      - name: Run pure-Go offline verification suite
        run: bash code/scripts/offline_verify.sh

      - name: Verify Go WebAssembly compilation (GOOS=js GOARCH=wasm)
        run: |
          (cd labs && GOOS=js GOARCH=wasm go build -buildvcs=false -ldflags="-s -w" -o /tmp/labs-ci.wasm ./wasm)

      - name: Validate index.html JS syntax, asset refs & live Go WASM runtime
        run: |
          node -e '
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const m = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!m) throw new Error("No inline script block found");
          new Function(m[1]);
          const refs = [...html.matchAll(/(?:src|href)="(assets\/[^"]+)"/g)].map(x => x[1]);
          for (const r of refs) {
            if (!fs.existsSync(r)) throw new Error("Missing asset: " + r);
          }
          require("./assets/wasm_exec.js");
          const go = new Go();
          const bytes = fs.readFileSync("assets/labs.wasm");
          WebAssembly.instantiate(bytes, go.importObject).then(({ instance }) => {
            global.__onGoWasmReady = () => {
              const r1 = global.goRunLab("drift", fs.readFileSync("labs/approval/main.go", "utf8"));
              const r2 = global.goRunLab("chain", fs.readFileSync("labs/audit/main.go", "utf8"));
              if (!r1.ok || !r1.out.includes("ErrRiskChanged")) throw new Error("WASM drift failed");
              if (!r2.ok || !r2.out.includes("BROKEN at seq 2 (row_hash)")) throw new Error("WASM audit failed");
              console.log(`[OK] index.html JS valid; ${refs.length} assets verified; Go WASM live checks passed.`);
              process.exit(0);
            };
            go.run(instance);
          }).catch(err => { console.error(err); process.exit(1); });
          '
